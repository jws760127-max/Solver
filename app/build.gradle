plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snapsolver.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.snapsolver.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // 업데이트할 때도 같은 서명으로 덮어 설치되도록 고정 키를 써요 (개인용 앱이라 저장소에 함께 둬요)
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'snapsolver'
            keyAlias 'snap'
            keyPassword 'snapsolver'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.guava:listenablefuture:1.0'
    // 카메라 라이브러리가 끌고 오는 Kotlin 버전을 하나로 맞춰요 (중복 클래스 오류 방지)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
