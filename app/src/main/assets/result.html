<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>풀이 기록</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:false},options:{enableMenu:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fc,#0b1120);--grid:light-dark(#e2e8f4,#162036);--card:light-dark(#fff,#111a2d);--ink:light-dark(#141c35,#e9edf7);--mut:light-dark(#545e80,#9ca7c7);--line:light-dark(#d5dbea,#26324e);--blue:light-dark(#2643b8,#8ea4ff);--on:light-dark(#fff,#0b1120);--red:light-dark(#d62c1b,#ff6b57);--soft:light-dark(#eef2fc,#17213a)}
*{box-sizing:border-box;min-width:0}body{margin:0;padding:14px 12px 40px;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.6 system-ui,sans-serif}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 16px 46px;margin-bottom:14px}
.card::before{content:'';position:absolute;top:0;bottom:0;left:34px;width:2px;background:light-dark(#f1b2a9,#5b2b2b)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}
.top button,.clear{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--blue);background:var(--card);color:var(--blue);font-weight:700;font-size:14px}
.shot{display:block;max-width:100%;max-height:150px;border-radius:10px;margin:8px 0}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.q{background:var(--soft);border-radius:10px;padding:10px 12px}.q p,.step p{margin:4px 0}
.ans{display:flex;align-items:center;gap:12px;margin:12px 0 6px;padding:12px 14px;border:2px solid var(--red);border-radius:12px;font-size:19px;font-weight:700}.ans p{margin:0}
.mark{flex:none;width:44px;height:44px;border:2.5px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);font-size:18px;transform:rotate(-8deg)}
.step{position:relative;padding:8px 0 10px;border-bottom:1px dashed var(--line)}.step .n{position:absolute;left:-42px;width:26px;text-align:right;font-size:24px;color:var(--blue);font-weight:700}
.step h4{margin:0;font-size:16px}.key{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px}.key p{margin:2px 0}
code{font:14px ui-monospace,monospace;background:var(--soft);padding:1px 5px;border-radius:5px}.code{margin:8px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.ch{padding:4px 10px;background:var(--soft);font-size:13px;color:var(--mut)}.ch button{display:none}.code pre{margin:0;padding:10px;overflow-x:auto}.code pre code{background:none;padding:0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
mjx-container[display=true]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.empty{text-align:center;color:var(--mut);padding:60px 20px;background:var(--card);border-radius:16px;border:1px solid var(--line)}
</style></head><body><div id="list"></div><div style="text-align:center"><button class="clear" id="clr" hidden>기록 모두 지우기</button></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function md(s){const K=[],keep=(h,block)=>{K.push(h);const p='\u0000'+(K.length-1)+'\u0000';return block?'\n\n'+p+'\n\n':p};
  s=s.replace(/```([\w#+.-]*)[^\n]*\n([\s\S]*?)(?:```|$)/g,(m,lang,code)=>keep(`<div class="code"><div class="ch"><span>${esc(lang||'코드')}</span><button type="button" class="cp">복사</button></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`,true));
  s=s.replace(/\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)/g,m=>keep(esc(m)));
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>keep('<code>'+esc(c)+'</code>'));
  const UL=/^\s*[-*•]\s+/,OL=/^\s*\d+[.)]\s+/;
  const html=esc(s).trim().split(/\n\s*\n/).filter(b=>b.trim()).map(b=>{const L=b.split('\n').filter(l=>l.trim());
    if(L.length===1&&/^\u0000\d+\u0000$/.test(L[0].trim()))return L[0].trim();
    if(L.length>=2&&L.every(l=>l.trim().startsWith('|'))&&/^\|?[\s:|-]+$/.test(L[1].trim())){const row=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));
      return`<div class="scroll"><table><thead><tr>${row(L[0]).map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${L.slice(2).map(l=>`<tr>${row(l).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    let o='',p=[],li=[],kind='';
    const fp=()=>{if(p.length)o+='<p>'+p.map(inl).join('<br>')+'</p>';p=[]},fl=()=>{if(li.length)o+=`<${kind}>`+li.map(l=>'<li>'+inl(l)+'</li>').join('')+`</${kind}>`;li=[]};
    for(const l of L){const hd=l.match(/^\s*#{1,6}\s+(.+)$/),k=UL.test(l)?'ul':OL.test(l)?'ol':'';
      if(hd){fp();fl();kind='';o+=`<p class="mh"><strong>${inl(hd[1])}</strong></p>`}
      else if(k){fp();if(k!==kind)fl();kind=k;li.push(l.replace(k==='ul'?UL:OL,''))}else{fl();kind='';p.push(l)}}
    fp();fl();return o}).join('');
  return html.replace(/\u0000(\d+)\u0000/g,(_,i)=>K[i])}
function parse(out){const A=[];let c=null,fence=false;
  for(const line of out.split('\n')){if(/^\s*```/.test(line))fence=!fence;
    const h2=!fence&&line.match(/^##\s+(.+?)\s*$/),h3=!fence&&line.match(/^###\s+(.+?)\s*$/);
    if(h2){c={title:h2[1],body:'',subs:[]};A.push(c);continue}
    if(!c){c={title:'',body:'',subs:[]};A.push(c)}
    if(h3){c.subs.push({title:h3[1],body:''});continue}
    (c.subs.length?c.subs[c.subs.length-1]:c).body+=line+'\n'}return A}
const sec=(out,w)=>{const s=parse(out||'').find(x=>x.title.includes(w));return s?s.body.trim():''};
const stripN=t=>t.replace(/^\s*(\d+\s*단계|단계\s*\d+|\d+)\s*[:.)\-–]?\s*/,'');
let items=[];
function card(it,i){const A=parse(it.text||'');let h=`<div class="top"><span>${new Date(it.id).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})}</span><button data-i="${i}">다시 듣기</button></div>`;
  if(it.thumb)h+=`<img class="shot" src="${it.thumb}" alt="">`;
  for(const s of A){const t=s.title,b=s.body.trim();
    if(t.includes('음성'))continue;
    if(t.includes('문제'))h+=`<span class="lbl">문제</span><div class="q">${md(b)}</div>`;
    else if(t.includes('풀이')){h+=`<span class="lbl">풀이</span>${b?md(b):''}`;s.subs.forEach((st,k)=>h+=`<div class="step"><span class="n">${k+1}</span><h4>${md(stripN(st.title)).replace(/^<p>|<\/p>$/g,'')}</h4>${md(st.body)}</div>`)}
    else if(t.includes('답'))h+=`<div class="ans"><span class="mark">답</span><div>${md(b)}</div></div>`;
    else if(t.includes('포인트'))h+=`<div class="key"><span class="lbl" style="margin-top:0">핵심 포인트</span>${md(b)}</div>`;
    else if(t)h+=`<span class="lbl">${esc(t)}</span>${md(b)}`;else if(b)h+=md(b)}
  return`<article class="card">${h}</article>`}
window.render=json=>{try{items=JSON.parse(json)}catch(e){items=[]}
  const L=$('#list');if(window.MathJax&&MathJax.typesetClear)try{MathJax.typesetClear([L])}catch(e){}
  L.innerHTML=items.length?items.map(card).join(''):'<div class="empty">아직 푼 문제가 없어요.<br>카메라로 문제를 찍어 보세요.</div>';
  $('#clr').hidden=!items.length;typeset(L)};
function typeset(el,n=0){const M=window.MathJax;if(M&&M.typesetPromise)M.startup.promise.then(()=>M.typesetPromise([el])).catch(()=>{});else if(n<60)setTimeout(()=>typeset(el,n+1),250)}
document.addEventListener('click',e=>{const b=e.target.closest('.top button');if(b){const it=items[+b.dataset.i];if(!it)return;const v=sec(it.text,'음성')||('답은 '+sec(it.text,'답'));window.Android&&Android.speak(v);return}
  if(e.target.id==='clr'&&window.Android)Android.clearAll()});
}
</script></body></html>
