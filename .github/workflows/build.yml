name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['wifi-camera/**', '.github/workflows/solvecam.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk SnapSolver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SnapSolver
          path: SnapSolver.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 찍으면 풀이 (최신)
          body: 휴대폰에서 아래 SnapSolver.apk를 눌러 받은 뒤 설치하세요.
          files: SnapSolver.apk
          make_latest: true
